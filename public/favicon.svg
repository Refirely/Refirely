<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none">
  <defs>
    <!-- Multi-colored outer border gradient -->
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#14b8a6" />
      <stop offset="35%" stop-color="#6366f1" />
      <stop offset="70%" stop-color="#d946ef" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Rich Dark Indigo/Teal Background -->
    <radialGradient id="bgGrad" cx="30%" cy="25%" r="85%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="55%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#042f2e" />
    </radialGradient>

    <!-- FIRE Flame Gradients -->
    <linearGradient id="flameLeft" x1="34" y1="146" x2="96" y2="20" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#e11d48" />
      <stop offset="52%" stop-color="#f97316" />
      <stop offset="100%" stop-color="#fbbf24" />
    </linearGradient>

    <linearGradient id="flameRight" x1="62" y1="146" x2="114" y2="24" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ea580c" />
      <stop offset="55%" stop-color="#fb923c" />
      <stop offset="100%" stop-color="#fef08a" />
    </linearGradient>

    <!-- Tropical Palm Frond Gradient -->
    <linearGradient id="palmGrad" x1="72" y1="154" x2="166" y2="46" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="52%" stop-color="#14b8a6" />
      <stop offset="100%" stop-color="#22d3ee" />
    </linearGradient>

    <!-- Global Flight-Path & Globe Cradle Gradient -->
    <linearGradient id="flightPath" x1="24" y1="136" x2="160" y2="128" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="55%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>
  </defs>

  <!-- Outer Multi-Color Rounded Squircle -->
  <rect x="6" y="6" width="188" height="188" rx="46" fill="url(#bgGrad)" stroke="url(#ringGrad)" stroke-width="8" />

  <!-- Subtle Ambient Glows -->
  <circle cx="68" cy="70" r="46" fill="#f97316" fill-opacity="0.16" />
  <circle cx="128" cy="96" r="42" fill="#14b8a6" fill-opacity="0.18" />

  <!-- 1. Left/Center FIRE Flame (3 Tongues + S-Curve Split + Lower Wisp) -->
  <path
    d="M 70 146 C 40 130 32 98 48 66 C 50 76 55 82 59 77 C 56 58 64 44 74 36 C 73 48 77 56 81 60 C 83 42 91 27 100 18 C 91 48 64 76 58 112 C 55 126 61 138 70 146 Z"
    fill="url(#flameLeft)"
  />
  <path
    d="M 75 146 C 63 116 69 84 94 56 C 102 46 106 34 105 22 C 118 42 117 74 100 102 C 89 120 80 132 75 146 Z"
    fill="url(#flameRight)"
  />
  <path
    d="M 39 138 C 28 128 27 111 36 98 C 35 113 40 125 49 134 C 45 138 42 139 39 138 Z"
    fill="url(#flameLeft)"
  />

  <!-- 2. Tropical Haven Palm Frond (5 Distinct Leaflets) -->
  <path
    d="M 72 154 C 76 110 104 66 164 46 C 153 55 141 61 126 64 L 168 62 C 155 72 141 78 121 80 L 162 80 C 147 90 133 95 113 96 L 150 98 C 135 107 121 110 103 110 L 136 115 C 121 123 107 125 93 123 C 85 134 80 144 78 154 Z"
    fill="url(#palmGrad)"
  />

  <!-- 3. Globe Cradle & Curved Flight-Path Arrow -->
  <path
    d="M 46 155 C 76 183 118 181 146 153"
    stroke="url(#flightPath)"
    stroke-width="5.5"
    stroke-linecap="round"
  />
  <path
    d="M 68 156 L 62 166 M 91 161 L 89 175 M 114 157 L 117 171"
    stroke="url(#flightPath)"
    stroke-width="3.8"
    stroke-linecap="round"
  />
  <path
    d="M 22 130 C 48 160 100 163 135 139 L 128 130 L 153 131 L 143 152 L 139 144 C 102 172 46 168 22 130 Z"
    fill="url(#flightPath)"
  />

  <!-- 4. Ascending Commercial Passenger Jet Airplane -->
  <g transform="translate(168, 111) rotate(-38)">
    <path
      d="M 25 0 C 25 -3.0 18.5 -4.0 11 -4.0 L 5.5 -4.0 L -6 -24 L -11 -24 L -3.5 -3.8 L -14.5 -2.7 L -21.5 -11 L -24.5 -11 L -20 -1.5 L -22.5 0 L -20 1.5 L -24.5 11 L -21.5 11 L -14.5 2.7 L -3.5 3.8 L -11 24 L -6 24 L 5.5 4.0 L 11 4.0 C 18.5 4.0 25 3.0 25 0 Z"
      fill="#ffffff"
    />
    <path d="M 1.5 -11.2 L 7 -11.2 C 8.2 -11.2 8.2 -8.2 7 -8.2 L 0.5 -8.2 Z" fill="#ffffff" />
    <path d="M 1.5 11.2 L 7 11.2 C 8.2 11.2 8.2 8.2 7 8.2 L 0.5 8.2 Z" fill="#ffffff" />
  </g>
</svg>
